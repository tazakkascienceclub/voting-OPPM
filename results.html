<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Election Results - OPPM & KGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plugin untuk Menampilkan Label, Angka & Persentase -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <!-- Header -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center pb-6 border-b border-slate-800 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-white uppercase tracking-wider">LIVE ELECTION DASHBOARD</h1>
            <p class="text-xs text-slate-400">Real-time vote count for OPPM President & KGP Commander</p>
        </div>
        <div class="mt-4 md:mt-0 flex gap-2">
            <button onclick="toggleChartType('bar')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold transition">Bar Chart</button>
            <button onclick="toggleChartType('pie')" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-xs font-bold transition">Pie Chart</button>
        </div>
    </header>

    <!-- Main Charts Container -->
    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- OPPM Chart Card -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <h2 class="text-lg font-bold text-blue-400 mb-4 text-center">President of OPPM Results</h2>
            <div class="relative h-96">
                <canvas id="oppmChart"></canvas>
            </div>
        </div>

        <!-- KGP Chart Card -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <h2 class="text-lg font-bold text-amber-400 mb-4 text-center">Commander of KGP Results</h2>
            <div class="relative h-96">
                <canvas id="kgpChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        Chart.register(ChartDataLabels);

        const SUPABASE_URL = 'https://ygzjtunzdogyzknahuoc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9NmwUGI_33ghyE0oJVPKjQ_RaXUN8cb';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentChartType = 'bar';
        let oppmChartInstance = null;
        let kgpChartInstance = null;

        async function fetchAndRenderResults() {
            const { data: candidates, error: candErr } = await supabaseClient.from('candidates').select('*').order('candidate_number');
            const { data: votes, error: voteErr } = await supabaseClient.from('votes').select('*');

            if (candErr || voteErr) {
                console.error("Error fetching data:", candErr || voteErr);
                return;
            }

            if (!candidates) return;

            // Prepare OPPM Data
            const oppmCandidates = candidates.filter(c => c.category === 'OPPM');
            const oppmLabels = oppmCandidates.map(c => c.name);
            const oppmData = oppmCandidates.map(c => votes ? votes.filter(v => v.candidate_id === c.id).length : 0);

            // Prepare KGP Data
            const kgpCandidates = candidates.filter(c => c.category === 'KGP');
            const kgpLabels = kgpCandidates.map(c => c.name);
            const kgpData = kgpCandidates.map(c => votes ? votes.filter(v => v.candidate_id === c.id).length : 0);

            renderChart('oppmChart', oppmLabels, oppmData, 'OPPM Votes', ['#3b82f6', '#60a5fa', '#93c5fd']);
            renderChart('kgpChart', kgpLabels, kgpData, 'KGP Votes', ['#f59e0b', '#fbbf24', '#fde047']);
        }

        function renderChart(canvasId, labels, data, label, colors) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            if (canvasId === 'oppmChart' && oppmChartInstance) oppmChartInstance.destroy();
            if (canvasId === 'kgpChart' && kgpChartInstance) kgpChartInstance.destroy();

            const totalVotes = data.reduce((sum, val) => sum + val, 0);

            const chartConfig = {
                type: currentChartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: currentChartType === 'bar' ? 25 : 10,
                            bottom: 10
                        }
                    },
                    plugins: {
                        legend: { 
                            display: currentChartType === 'pie', 
                            position: 'bottom', 
                            labels: { color: '#fff', font: { size: 12 } } 
                        },
                        datalabels: {
                            anchor: currentChartType === 'bar' ? 'end' : 'center',
                            align: currentChartType === 'bar' ? 'top' : 'center',
                            color: currentChartType === 'bar' ? '#38bdf8' : '#0f172a',
                            font: {
                                weight: 'bold',
                                size: 11
                            },
                            textAlign: 'center',
                            formatter: (value, context) => {
                                const candidateName = context.chart.data.labels[context.dataIndex];
                                const percentage = totalVotes > 0 ? ((value / totalVotes) * 100).toFixed(1) : 0;
                                
                                // Jika mode Pie Chart: Tampilkan [Nama Kandidat + Suara + Persentase]
                                if (currentChartType === 'pie') {
                                    if (value === 0 && totalVotes === 0) return `${candidateName}\n0 votes (0%)`;
                                    return `${candidateName}\n${value} votes (${percentage}%)`;
                                } 
                                // Jika mode Bar Chart: Tampilkan [Suara + Persentase] saja (Nama sudah ada di sumbu X)
                                else {
                                    if (value === 0 && totalVotes === 0) return '0 (0%)';
                                    return `${value} votes (${percentage}%)`;
                                }
                            }
                        }
                    },
                    scales: currentChartType === 'bar' ? {
                        y: { 
                            beginAtZero: true, 
                            ticks: { color: '#94a3b8', precision: 0 },
                            grid: { color: '#334155' }
                        },
                        x: { 
                            ticks: { color: '#94a3b8', font: { weight: 'bold' } },
                            grid: { display: false }
                        }
                    } : {}
                }
            };

            if (canvasId === 'oppmChart') oppmChartInstance = new Chart(ctx, chartConfig);
            if (canvasId === 'kgpChart') kgpChartInstance = new Chart(ctx, chartConfig);
        }

        function toggleChartType(type) {
            currentChartType = type;
            fetchAndRenderResults();
        }

        // Realtime Listener
        supabaseClient.channel('realtime_votes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'votes' }, () => {
                fetchAndRenderResults();
            })
            .subscribe();

        fetchAndRenderResults();
    </script>
</body>
</html>
